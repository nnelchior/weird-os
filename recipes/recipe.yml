---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: weird-os
description: This is my personal OS image.

base-image: ghcr.io/ublue-os/base-main
image-version: latest

modules:
  - type: files
    files:
      - source: system
        destination: /
  - type: dnf
    repos:
      copr:
        - lionheartp/Hyprland
        - atim/starship 
        - avengemedia/dms-git
        - dejan/lazygit
        - ifas/zellij
        - boobaa/yazi
        
    install:
      packages:
        - dms
        - hyprland
        - neovim
        - starship
        - xdg-desktop-portal-hyprland
        - kitty
        - git
        - zoxide
        - lazygit
        - eza
        - ripgrep
        - nushell
        - zellij
        - fzf
        - yazi
        - sddm
        - hyprland-guiutils

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - org.mozilla.firefox
          - io.podman_desktop.PodmanDesktop
          
      - scope: user

  - type: signing
